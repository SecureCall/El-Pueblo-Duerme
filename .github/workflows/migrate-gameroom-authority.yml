name: Migrate GameRoom Authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite GameRoom
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/game/GameRoom.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import { xpToLevel, levelEmoji } from '@/lib/firebase/xp';", "import { levelEmoji } from '@/lib/firebase/xp';")
          s = s.replace("import { BOT_NAMES, assignBotType, type BotType } from '@/lib/bots/botSystem';\n", "")
          s = s.replace("import { getBehaviorProfile } from '@/lib/bots/playerStats';\n", "")
          s = s.replace("import { useAuth } from '@/app/providers/AuthProvider';", "import { useAuth } from '@/app/providers/AuthProvider';\nimport { requestLobbyJoin, requestLobbyLeave, requestLobbyKick, requestLobbyPresence, requestLobbyFillBots, requestGameStart } from '@/lib/firebase/lobbyActions';")
          s = s.replace("  doc, onSnapshot, updateDoc, arrayUnion, arrayRemove, serverTimestamp,\n  collection, addDoc, query, orderBy, limit, onSnapshot as onSnap, deleteDoc,\n  getDoc,\n", "  doc, onSnapshot, serverTimestamp,\n  collection, addDoc, query, orderBy, limit, onSnapshot as onSnap,\n")
          s, n = re.subn(r"\n// Bias de personalidad.*?\nfunction generateAIPlayers\(.*?\n\}\n\n", "\n", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('AI generator block not found')
          s, n = re.subn(r"  const kickPlayer = async \(targetUid: string\) => \{.*?\n  \};", """  const kickPlayer = async (targetUid: string) => {
            if (!isHost || !game || targetUid === user?.uid) return;
            try { await requestLobbyKick(gameId, targetUid); }
            catch (error) { console.error('Error expulsando jugador:', error); }
          };""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('kick block not found')
          s, n = re.subn(r"      getDoc\(doc\(db, 'users', user\.uid\)\)\.then\(snap => \{.*?\n      \}\)\.catch\(\(\) => \{\}\);", """      requestLobbyJoin(gameId, resolvedName).catch((error) => {
            console.error('Error entrando en sala:', error);
          });""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('join block not found')
          s, n = re.subn(r"    const updatePresence = \(\) => \{.*?\n    \};", """    const updatePresence = () => {
            const me = game.players?.find(p => p.uid === user.uid);
            if (!me) return;
            requestLobbyPresence(gameId).catch((error) => {
              console.error('Error actualizando presencia:', error);
            });
          };""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('presence block not found')
          s, n = re.subn(r"    const realNow = \(game\.players \?\? \[\]\)\.filter\(p => !p\.isAI\);.*?\n    setRetentionCountdown\(null\);", """    const realNow = (game.players ?? []).filter(p => !p.isAI);
            if (realNow.length >= 4) return;
            await requestLobbyFillBots(gameId).catch((error) => {
              console.error('Error rellenando bots:', error);
            });
            setRetentionCountdown(null);""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('autofill block not found')
          s, n = re.subn(r"  const leaveGame = async \(\) => \{.*?\n  \};", """  const leaveGame = async () => {
            if (!user || !game) return;
            try { await requestLobbyLeave(gameId); }
            catch (error) { console.error('Error saliendo de sala:', error); }
            router.push('/');
          };""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('leave block not found')
          s, n = re.subn(r"  const startGame = async \(\) => \{.*?\n  \};", """  const startGame = async () => {
            if (!user || !game || game.hostUid !== user.uid) return;
            stop();
            setStarting(true);
            try { await requestGameStart(gameId); }
            catch (error) { console.error('Error starting game:', error); setStarting(false); }
          };""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('start block not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add regression guard
        run: |
          cat > tests/gameRoomAuthorityGuard.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const source = readFileSync(resolve(process.cwd(), 'components/game/GameRoom.tsx'), 'utf8');

          describe('GameRoom authority guard', () => {
            it('routes lobby mutations through server helpers', () => {
              expect(source).toContain('requestLobbyJoin');
              expect(source).toContain('requestLobbyLeave');
              expect(source).toContain('requestLobbyKick');
              expect(source).toContain('requestLobbyPresence');
              expect(source).toContain('requestLobbyFillBots');
              expect(source).toContain('requestGameStart');
            });
            it('does not directly mutate the game document for lobby authority', () => {
              expect(source).not.toMatch(/updateDoc\(doc\(db,\s*['"]games['"]/);
              expect(source).not.toMatch(/setDoc\(doc\(db,\s*['"]games['"]/);
              expect(source).not.toMatch(/deleteDoc\(doc\(db,\s*['"]games['"]/);
              expect(source).not.toMatch(/arrayUnion/);
              expect(source).not.toMatch(/arrayRemove/);
            });
            it('does not generate AI players in the browser', () => {
              expect(source).not.toMatch(/generateAIPlayers/);
              expect(source).not.toMatch(/BOT_NAMES/);
              expect(source).not.toMatch(/assignBotType/);
            });
          });
          EOF

      - name: Validate
        run: |
          git diff --check
          npm ci
          npx vitest run tests/gameRoomAuthorityGuard.test.ts

      - name: Commit and remove migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/GameRoom.tsx tests/gameRoomAuthorityGuard.test.ts
          git diff --cached --check
          git commit -m 'fix: move GameRoom lobby mutations to server authority'
          git rm .github/workflows/migrate-gameroom-authority.yml
          git commit -m 'chore: remove one-time GameRoom migration'
          git push origin main