name: Apply day resolution fencing patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/game/play/GamePlay.tsx')
          s = p.read_text(encoding='utf-8')
          if 'dayResolutionLeaseRef' in s and "action: 'commit'" in s:
              print('already patched')
          else:
              if 'dayResolutionLeaseRef' not in s:
                  s = s.replace('  const processingDayRef = useRef(false);\n', '  const processingDayRef = useRef(false);\n  const dayResolutionLeaseRef = useRef<string | null>(null);\n', 1)
              start = """  async function processDayVotes(dayVotes: Record<string, string>) {\n    if (!game) return;\n    if (game.phase !== 'day' && game.phase !== 'voting') { return; }\n    if (processingDayRef.current) return;\n    processingDayRef.current = true;\n    const roles = game.roles ?? {};\n"""
              replacement = """  async function processDayVotes(dayVotes: Record<string, string>) {\n    if (!game) return;\n    if (game.phase !== 'day' && game.phase !== 'voting') { return; }\n    if (processingDayRef.current) return;\n    processingDayRef.current = true;\n    let dayLeaseId: string | null = null;\n    try {\n      if (!user) throw new Error('AUTH_REQUIRED');\n      const idToken = await user.getIdToken();\n      const lockResponse = await fetch('/api/day-resolve', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` }, body: JSON.stringify({ gameId, action: 'claim' }) });\n      const lockData = await lockResponse.json().catch(() => ({}));\n      if (!lockResponse.ok || !lockData.ok || !lockData.leaseId) { processingDayRef.current = false; return; }\n      dayLeaseId = lockData.leaseId;\n      dayResolutionLeaseRef.current = dayLeaseId;\n      if (Number(lockData.round) !== (game.roundNumber ?? 1)) { processingDayRef.current = false; return; }\n      dayVotes = lockData.votes ?? {};\n    } catch (e) {\n      console.error('[DayResolution] lease claim failed:', e);\n      processingDayRef.current = false;\n      return;\n    }\n    const roles = game.roles ?? {};\n"""
              if start not in s: raise SystemExit('start not found')
              s = s.replace(start, replacement, 1)
              marker = '        revealDeadResult: null,\n      });'
              idx = s.find(marker)
              if idx < 0: raise SystemExit('marker not found')
              call_start = s.rfind("    await updateDoc(doc(db, 'games', gameId), {", 0, idx)
              if call_start < 0: raise SystemExit('final update not found')
              body_start = call_start + len("    await updateDoc(doc(db, 'games', gameId), {")
              body_end = idx + len('        revealDeadResult: null,')
              body = s[body_start:body_end]
              new_call = "    const dayPatch = {" + body + "\n    };\n    const commitToken = await user.getIdToken();\n    const commitResponse = await fetch('/api/day-resolve', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${commitToken}` }, body: JSON.stringify({ gameId, action: 'commit', leaseId: dayLeaseId, round, patch: dayPatch }) });\n    if (!commitResponse.ok) { const commitData = await commitResponse.json().catch(() => ({})); throw new Error(commitData.error || 'DAY_COMMIT_REJECTED'); }"
              s = s[:call_start] + new_call + s[idx + len(marker):]
              oldf = """    } catch (e) {\n      console.error('processDayVotes updateDoc error:', e);\n    } finally {\n      processingDayRef.current = false;\n    }\n  }\n"""
              newf = """    } catch (e) {\n      console.error('processDayVotes error:', e);\n    } finally {\n      if (dayLeaseId) {\n        try {\n          const idToken = await user?.getIdToken();\n          if (idToken) await fetch('/api/day-resolve', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` }, body: JSON.stringify({ gameId, action: 'release', leaseId: dayLeaseId }) });\n        } catch (e) { console.warn('[DayResolution] lease release failed:', e); }\n        if (dayResolutionLeaseRef.current === dayLeaseId) dayResolutionLeaseRef.current = null;\n      }\n      processingDayRef.current = false;\n    }\n  }\n"""
              if oldf not in s: raise SystemExit('finally not found')
              s = s.replace(oldf, newf, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -q "action: 'commit'" components/game/play/GamePlay.tsx
          rm .github/workflows/wire-day-resolution-fencing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx .github/workflows/wire-day-resolution-fencing.yml
          git commit -m "security: fence day resolution final commit"
          git push
