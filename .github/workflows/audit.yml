name: Release Audit

on:
  push:
    branches:
      - audit/fix-release
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile
        run: npm install --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lockfile"
          git push origin HEAD:audit/fix-release
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run lint
      - run: npm run build
