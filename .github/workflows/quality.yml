name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout audit branch for migration verification
        uses: actions/checkout@v4
        with:
          ref: audit/role-swap-authority
          path: audit-worktree
          fetch-depth: 0

      - name: Transform and verify GamePlay
        working-directory: audit-worktree
        run: |
          python3 scripts/migrate-gameplay-day.py
          grep -n 'requestResolveDay' components/game/play/GamePlay.tsx
          git diff --check

      - name: Upload transformed GamePlay
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-day-migration
          path: audit-worktree/components/game/play/GamePlay.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
