name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firestore emulator test tooling
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4.0.1 firebase-tools@14.22.0

      - name: Run Firestore rules integration tests
        run: npx firebase emulators:exec --only firestore --project demo-el-pueblo-duerme-friends "npm run test:firestore"

      - name: Run tests
        run: npm test

      - name: Build
        # The client Firebase SDK is imported by the app shell during static prerendering.
        # CI uses a format-valid, non-production key so builds do not require production secrets.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' }}
        run: npm run build

      - name: Run lint
        run: npm run lint
