name: migrate-night-authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove host-side night resolver
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('components/game/play/GamePlay.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = '  // Host processes night when all required submissions received'
          end_marker = '  const submitDayVote = useCallback(async (targetUid: string) => {'

          if start_marker not in text:
              print('Legacy host night resolver already removed.')
              raise SystemExit(0)

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''  // ── Server-authoritative night resolution ───────────────────────────────
  // Any connected player may request resolution. The API owns authentication,
  // action validation, the private role snapshot, the round lock and the
  // atomic Firestore commit. The host is deliberately not a dependency.
  useEffect(() => {
    if (!game || !user || game.phase !== 'night') return;

    const startedAt = game.nightStartedAt ?? Date.now();
    const MIN_NIGHT_MS = 20000;
    const NIGHT_TIMEOUT_MS = 58000;
    const elapsed = Date.now() - startedAt;

    const resolveOnServer = async () => {
      if (processingNightRef.current) return;
      processingNightRef.current = true;
      try {
        const currentUser = auth.currentUser;
        if (!currentUser) return;
        const idToken = await currentUser.getIdToken();
        const response = await fetch('/api/resolve-night', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${idToken}`,
          },
          credentials: 'include',
          body: JSON.stringify({ gameId }),
        });

        if (!response.ok && response.status !== 409) {
          const data = await response.json().catch(() => ({}));
          console.warn('[server-night] resolution request failed', data?.error ?? response.status);
        }
      } catch (error) {
        console.error('[server-night] resolution request error', error);
      } finally {
        processingNightRef.current = false;
      }
    };

    const subs = game.nightSubmissions ?? {};
    const roles = game.roles ?? {};
    const activePlayers = (game.players ?? []).filter(p => p.isAlive);
    const round = game.roundNumber ?? 1;
    const has = (role: string, condition = true) =>
      condition && activePlayers.some(p => roles[p.uid] === role);
    const done = (key: string, present: boolean) => !present || !!subs[key];
    const hasWolves = activePlayers.some(p => ['Lobo', 'Lobo Blanco', 'Cría de Lobo'].includes(roles[p.uid]));
    const allDone =
      (!hasWolves || !!subs.wolves) &&
      (!has('Lobo Blanco') || round % 2 !== 0 || !!subs.loboblanco) &&
      done('vidente', has('Vidente')) &&
      done('hechicera', has('Hechicera')) &&
      done('bruja', has('Bruja')) &&
      done('cupido', has('Cupido', round === 1)) &&
      done('guardian', has('Guardián')) &&
      done('doctor', has('Doctor')) &&
      done('flautista', has('Flautista')) &&
      done('perrolo', has('Perro Lobo', round === 1)) &&
      done('salvaje', has('Niño Salvaje', round === 1)) &&
      done('profeta', has('Profeta')) &&
      done('sacerdote', has('Sacerdote')) &&
      done('ladron', has('Ladrón', round === 1)) &&
      done('espia', has('Espía')) &&
      done('anciana', has('Anciana Líder')) &&
      done('angelresucitador', has('Ángel Resucitador') && !game.angelResucitadorUsed) &&
      done('silenciadora', has('Silenciadora')) &&
      done('sirena', has('Sirena del Río', round === 1)) &&
      done('virginiawoolf', has('Virginia Woolf', round === 1)) &&
      done('vigia', has('Vigía') && !game.vigiaUsed) &&
      done('banshee', has('Banshee')) &&
      done('cambiaformas', has('Cambiaformas', round === 1)) &&
      done('liderculto', has('Líder del Culto')) &&
      done('pescador', has('Pescador')) &&
      done('vampiro', has('Vampiro')) &&
      done('hadabuscadora', has('Hada Buscadora') && !game.hadaLinked) &&
      done('forense', has('Médico Forense')) &&
      done('saboteador', has('Saboteador'));

    const earlyDelay = Math.max(0, MIN_NIGHT_MS - elapsed);
    const timeoutDelay = Math.max(0, NIGHT_TIMEOUT_MS - elapsed);
    const shouldResolveEarly = allDone && elapsed >= MIN_NIGHT_MS;
    const timer = setTimeout(() => {
      if (shouldResolveEarly || Date.now() - startedAt >= NIGHT_TIMEOUT_MS) {
        void resolveOnServer();
      }
    }, shouldResolveEarly ? 0 : (allDone ? earlyDelay : timeoutDelay));

    return () => clearTimeout(timer);
  }, [game, user, gameId]);

'''

          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "import { db } from '@/lib/firebase/config';",
              "import { db, auth } from '@/lib/firebase/config';",
          )
          path.write_text(text, encoding='utf-8')
          print('Migration applied.')
          PY

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          if git diff --quiet -- components/game/play/GamePlay.tsx; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx
          git rm .github/workflows/migrate-night-authority.yml
          git commit -m 'fix: remove host-side night resolution'
          git push origin HEAD:main
