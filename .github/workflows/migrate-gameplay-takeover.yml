name: Migrate GamePlay host takeover authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrate host takeover
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/game/play/GamePlay.tsx')
          s = p.read_text()
          old_import = "import { requestNarratorBroadcast } from '@/lib/game/narratorBroadcast';"
          new_import = old_import + "\nimport { requestHostTakeover } from '@/lib/game/hostTakeover';"
          if 'requestHostTakeover' not in s:
              if old_import not in s:
                  raise SystemExit('host takeover import anchor not found')
              s = s.replace(old_import, new_import, 1)
          old = """        console.warn('[Host absent] Auto-claiming host after 5min absence');\n        const newPlayers = (game.players ?? []).map(p => ({ ...p, isHost: p.uid === user.uid }));\n        await updateDoc(doc(db, 'games', gameId), { hostUid: user.uid, players: newPlayers });"""
          new = """        console.warn('[Host absent] Requesting server-authoritative host takeover');\n        await requestHostTakeover(gameId);"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "await requestHostTakeover(gameId);" not in s:
              raise SystemExit('host takeover mutation anchor not found')
          p.write_text(s)
      - name: Guard migration
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('components/game/play/GamePlay.tsx').read_text()
          if 'requestHostTakeover' not in s:
              raise SystemExit('requestHostTakeover missing')
          if "updateDoc(doc(db, 'games', gameId), { hostUid: user.uid, players: newPlayers })" in s:
              raise SystemExit('direct host takeover write still present')
          PY
          git diff --check
      - name: Commit migration and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx .github/workflows/migrate-gameplay-takeover.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: make gameplay host takeover server-authoritative'
          git push origin HEAD:main
          git rm .github/workflows/migrate-gameplay-takeover.yml
          git commit -m 'chore: remove one-time gameplay migration workflow'
          git push origin HEAD:main
