name: tmp-apply-gameplay-day

on:
  push:
    branches:
      - audit/role-swap-authority

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified migration artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "requestResolveDay" components/game/play/GamePlay.tsx || grep -qE 'processDayVotes|BOT_VOTE_CONFIG|pickBotVoteTarget|dayResolutionLeaseRef|processingDayRef|aiDayVotedRound' components/game/play/GamePlay.tsx; then
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/SecureCall/El-Pueblo-Duerme/actions/artifacts/10473082313/zip" -o /tmp/migration.zip
            unzip -o /tmp/migration.zip -d /tmp/migration
            test -f /tmp/migration/GamePlay.tsx
            cp /tmp/migration/GamePlay.tsx components/game/play/GamePlay.tsx
          fi
      - name: Verify
        run: |
          grep -n "requestResolveDay" components/game/play/GamePlay.tsx
          if grep -nE 'processDayVotes|BOT_VOTE_CONFIG|pickBotVoteTarget|dayResolutionLeaseRef|processingDayRef|aiDayVotedRound' components/game/play/GamePlay.tsx; then exit 1; fi
          git diff --check
      - name: Commit
        run: |
          git config user.name 'El pueblo Duerme'
          git config user.email 'zalenatarot@gmail.com'
          git add components/game/play/GamePlay.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: make GamePlay day resolution host-independent'
          git push origin HEAD:audit/role-swap-authority
