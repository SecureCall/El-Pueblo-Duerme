name: Migrate GamePlay night resolution authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace client night resolver
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/game/play/GamePlay.tsx')
          s = p.read_text()
          import_anchor = "import { requestNightAction } from '@/lib/game/nightActions';"
          if "import { requestResolveNight } from '@/lib/game/resolveNight';" not in s:
              if import_anchor not in s:
                  raise SystemExit('night action import anchor not found')
              s = s.replace(import_anchor, import_anchor + "\nimport { requestResolveNight } from '@/lib/game/resolveNight';", 1)

          start_marker = "  async function processNight() {"
          start = s.find(start_marker)
          if start < 0:
              if "async function processNight()" not in s:
                  raise SystemExit('processNight function not found')
              raise SystemExit('processNight start marker not found')

          # Find the matching closing brace with a small TS/JS lexical scanner.
          brace = s.find('{', start)
          depth = 0
          i = brace
          state = 'code'
          while i < len(s):
              c = s[i]
              n = s[i + 1] if i + 1 < len(s) else ''
              if state == 'code':
                  if c == '/' and n == '/': state = 'line'; i += 2; continue
                  if c == '/' and n == '*': state = 'block'; i += 2; continue
                  if c == "'": state = 'single'; i += 1; continue
                  if c == '"': state = 'double'; i += 1; continue
                  if c == '`': state = 'template'; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              elif state == 'line':
                  if c == '\n': state = 'code'
              elif state == 'block':
                  if c == '*' and n == '/': state = 'code'; i += 2; continue
              elif state == 'single':
                  if c == '\\': i += 2; continue
                  if c == "'": state = 'code'
              elif state == 'double':
                  if c == '\\': i += 2; continue
                  if c == '"': state = 'code'
              elif state == 'template':
                  if c == '\\': i += 2; continue
                  if c == '`': state = 'code'
              i += 1
          else:
              raise SystemExit('could not find processNight closing brace')

          replacement = """  async function processNight() {\n    if (!game || game.phase !== 'night' || processingNightRef.current === false) {\n      processingNightRef.current = false;\n      return;\n    }\n    try {\n      await requestResolveNight(gameId);\n    } catch (e) {\n      processingNightRef.current = false;\n      console.error('processNight error:', e);\n    }\n  }"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
      - name: Guard migration
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('components/game/play/GamePlay.tsx').read_text()
          if "requestResolveNight(gameId)" not in s:
              raise SystemExit('requestResolveNight missing')
          if 'const rawActions = game.nightActions' in s:
              raise SystemExit('legacy client night resolver still present')
          PY
          git diff --check
      - name: Commit migration and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx .github/workflows/migrate-gameplay-night-resolution.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: make night resolution server-authoritative'
          git push origin HEAD:main
          git rm .github/workflows/migrate-gameplay-night-resolution.yml
          git commit -m 'chore: remove one-time night resolution migration workflow'
          git push origin HEAD:main
