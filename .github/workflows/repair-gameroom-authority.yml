name: Repair GameRoom Authority

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Migrate GameRoom writes to server authority
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/game/GameRoom.tsx')
          text = path.read_text(encoding='utf-8')

          imports = "import { requestLobbyJoin, requestLobbyLeave, requestLobbyKick, requestLobbyPresence, requestLobbyFillBots, requestGameStart } from '@/lib/firebase/lobbyActions';\n"
          if 'from \'@/lib/firebase/lobbyActions\'' not in text:
              marker = "import { getBehaviorProfile } from '@/lib/bots/playerStats';\n"
              if marker not in text:
                  raise SystemExit('GameRoom import marker not found')
              text = text.replace(marker, marker + imports, 1)

          kick = re.compile(r"  const kickPlayer = async \(targetUid: string\) => \{.*?\n  \};", re.S)
          text, count = kick.subn("""  const kickPlayer = async (targetUid: string) => {
    if (!isHost || !game || targetUid === user?.uid) return;
    try {
      await requestLobbyKick(gameId, targetUid);
    } catch (error) {
      console.error('Error expulsando jugador:', error);
    }
  };""", text, count=1)
          if count != 1:
              raise SystemExit('kickPlayer block not found')

          join = re.compile(r"      getDoc\(doc\(db, 'users', user\.uid\)\)\.then\(snap => \{.*?\n      \}\)\.catch\(\(\) => \{\}\);", re.S)
          text, count = join.subn("""      requestLobbyJoin(gameId, resolvedName).catch((error) => {
        console.error('Error entrando en sala:', error);
      });""", text, count=1)
          if count != 1:
              raise SystemExit('join block not found')

          presence = re.compile(r"    const updatePresence = \(\) => \{.*?\n    \};", re.S)
          text, count = presence.subn("""    const updatePresence = () => {
      const me = game.players?.find(p => p.uid === user.uid);
      if (!me) return;
      requestLobbyPresence(gameId).catch((error) => {
        console.error('Error actualizando presencia:', error);
      });
    };""", text, count=1)
          if count != 1:
              raise SystemExit('presence block not found')

          autofill = re.compile(r"    const realNow = \(game\.players \?\? \[\]\)\.filter\(p => !p\.isAI\);.*?\n    setRetentionCountdown\(null\);", re.S)
          text, count = autofill.subn("""    const realNow = (game.players ?? []).filter(p => !p.isAI);
    if (realNow.length >= 4) return;
    await requestLobbyFillBots(gameId).catch((error) => {
      console.error('Error rellenando bots:', error);
    });
    setRetentionCountdown(null);""", text, count=1)
          if count != 1:
              raise SystemExit('autoFill body not found')

          leave = re.compile(r"  const leaveGame = async \(\) => \{.*?\n  \};", re.S)
          text, count = leave.subn("""  const leaveGame = async () => {
    if (!user || !game) return;
    try {
      await requestLobbyLeave(gameId);
    } catch (error) {
      console.error('Error saliendo de sala:', error);
    }
    router.push('/');
  };""", text, count=1)
          if count != 1:
              raise SystemExit('leaveGame block not found')

          start = re.compile(r"  const startGame = async \(\) => \{.*?\n  \};", re.S)
          text, count = start.subn("""  const startGame = async () => {
    if (!user || !game || game.hostUid !== user.uid) return;
    stop();
    setStarting(true);
    try {
      await requestGameStart(gameId);
    } catch (err) {
      console.error('Error starting game:', err);
      setStarting(false);
    }
  };""", text, count=1)
          if count != 1:
              raise SystemExit('startGame block not found')

          # Remove imports that are now unused by the migrated lobby mutations.
          text = text.replace("  doc, onSnapshot, updateDoc, arrayUnion, arrayRemove, serverTimestamp,\n  collection, addDoc, query, orderBy, limit, onSnapshot as onSnap, deleteDoc,\n  getDoc,\n", "  doc, onSnapshot, serverTimestamp,\n  collection, addDoc, query, orderBy, limit, onSnapshot as onSnap,\n")
          text = text.replace("import { xpToLevel, levelEmoji } from '@/lib/firebase/xp';", "import { levelEmoji } from '@/lib/firebase/xp';")
          text = text.replace("import { BOT_NAMES, assignBotType, type BotType } from '@/lib/bots/botSystem';", "")
          text = text.replace("import { getBehaviorProfile } from '@/lib/bots/playerStats';\n", "")

          # generateAIPlayers is no longer needed: bot creation is server-authoritative.
          generator = re.compile(r"function biasedBotType\(.*?\n\}\n\nfunction generateAIPlayers\(.*?\n\}\n\n", re.S)
          text, count = generator.subn('', text, count=1)
          if count != 1:
              raise SystemExit('client bot generator block not found')

          path.write_text(text, encoding='utf-8')

      - name: Add authority regression guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/gameRoomAuthorityGuard.test.ts')
          p.write_text('''import { describe, expect, it } from 'vitest';\nimport { readFileSync } from 'node:fs';\nimport { resolve } from 'node:path';\n\nconst source = readFileSync(resolve(process.cwd(), 'components/game/GameRoom.tsx'), 'utf8');\n\ndescribe('GameRoom authority guard', () => {\n  it('routes lobby mutations through server helpers', () => {\n    expect(source).toContain('requestLobbyJoin');\n    expect(source).toContain('requestLobbyLeave');\n    expect(source).toContain('requestLobbyKick');\n    expect(source).toContain('requestLobbyPresence');\n    expect(source).toContain('requestLobbyFillBots');\n    expect(source).toContain('requestGameStart');\n  });\n\n  it('does not directly mutate the game document for lobby authority', () => {\n    expect(source).not.toMatch(/updateDoc\\(doc\\(db,\\s*['\"]games['\"]/);\n    expect(source).not.toMatch(/setDoc\\(doc\\(db,\\s*['\"]games['\"]/);\n    expect(source).not.toMatch(/deleteDoc\\(doc\\(db,\\s*['\"]games['\"]/);\n    expect(source).not.toMatch(/arrayUnion/);\n    expect(source).not.toMatch(/arrayRemove/);\n  });\n\n  it('does not generate or assign AI players in the browser', () => {\n    expect(source).not.toMatch(/generateAIPlayers/);\n    expect(source).not.toMatch(/BOT_NAMES/);\n    expect(source).not.toMatch(/assignBotType/);\n  });\n});\n''', encoding='utf-8')\n          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/GameRoom.tsx tests/gameRoomAuthorityGuard.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'fix: move GameRoom lobby mutations to server authority'
            git push origin main
          fi

      - name: Remove one-time migration workflow
        shell: bash
        run: |
          if [ -f .github/workflows/repair-gameroom-authority.yml ]; then
            git rm .github/workflows/repair-gameroom-authority.yml
            git commit -m 'chore: remove one-time GameRoom migration'
            git push origin main
          fi
