name: Refactor day client resolver
on:
  push:
    branches: [main]
jobs:
  refactor:
    if: github.event.head_commit.message != 'refactor: remove client day authority'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace client day resolver with server call
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/game/play/GamePlay.tsx')
          s=p.read_text()
          start=s.index('  async function processDayVotes(')
          end=s.index('\n  // Cazador fires last shot', start)
          new='''  async function processDayVotes(_dayVotes: Record<string, string>) {\n    if (!game || (game.phase !== 'day' && game.phase !== 'voting')) return;\n    if (processingDayRef.current) return;\n    processingDayRef.current = true;\n    let leaseId: string | null = null;\n    try {\n      if (!user) throw new Error('AUTH_REQUIRED');\n      const token = await user.getIdToken();\n      const claim = await fetch('/api/day-resolve', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },\n        body: JSON.stringify({ gameId, action: 'claim' }),\n      });\n      const claimData = await claim.json().catch(() => ({}));\n      if (!claim.ok || !claimData.ok || typeof claimData.leaseId !== 'string') return;\n      leaseId = claimData.leaseId;\n      dayResolutionLeaseRef.current = leaseId;\n      if (Number(claimData.round) !== (game.roundNumber ?? 1)) return;\n\n      const commit = await fetch('/api/day-resolve', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },\n        body: JSON.stringify({ gameId, action: 'commit', leaseId, round: game.roundNumber ?? 1 }),\n      });\n      const data = await commit.json().catch(() => ({}));\n      if (!commit.ok || !data.ok || !data.result) {\n        throw new Error(data.error || 'DAY_RESOLUTION_REJECTED');\n      }\n\n      const result = data.result as {\n        eliminated?: string | null;\n        secondEliminated?: string | null;\n        isTie?: boolean;\n        winner?: string | null;\n      };\n      const resolvedPlayers = result && Array.isArray(data.result.statePatch?.players)\n        ? data.result.statePatch.players\n        : [];\n      const currentWolfTeam = game.wolfTeam ?? {};\n      const wolfTeamUids = new Set(Object.keys(currentWolfTeam));\n      if (!result.winner) {\n        const eliminated = result.eliminated ?? null;\n        if (eliminated) {\n          const player = (resolvedPlayers as Array<{ uid: string; name?: string; role?: string; isAlive?: boolean }>).find(p => p.uid === eliminated);\n          const role = player?.role ?? game.roles?.[eliminated] ?? 'Aldeano';\n          const wasWolf = wolfTeamUids.has(eliminated);\n          if (wasWolf) triggerMoment(buildMoment('wolf_eliminated', { name: player?.name ?? '???', role }));\n          else if (['Vidente', 'Hechicera', 'Doctor', 'Cazador'].includes(role)) triggerMoment(buildMoment('unexpected_death', { name: player?.name ?? '???', role }));\n        }\n        if (result.isTie) triggerMoment(buildMoment('tie_vote'));\n        const alive = (resolvedPlayers as Array<{ uid: string; name?: string; isAlive?: boolean }>).filter(p => p.isAlive);\n        const aliveWolves = alive.filter(p => wolfTeamUids.has(p.uid));\n        const aliveVillage = alive.filter(p => !wolfTeamUids.has(p.uid));\n        if (aliveWolves.length === 1) triggerMoment(buildMoment('last_wolf', { name: aliveWolves[0].name }));\n        if (aliveWolves.length > 0 && aliveVillage.length <= aliveWolves.length + 1) triggerMoment(buildMoment('final_battle'));\n      }\n    } catch (error) {\n      console.error('[DayResolution] server resolution failed:', error);\n    } finally {\n      if (leaseId) {\n        try {\n          const token = await user?.getIdToken();\n          if (token) await fetch('/api/day-resolve', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },\n            body: JSON.stringify({ gameId, action: 'release', leaseId }),\n          });\n        } catch (error) {\n          console.warn('[DayResolution] lease release failed:', error);\n        }\n        if (dayResolutionLeaseRef.current === leaseId) dayResolutionLeaseRef.current = null;\n      }\n      processingDayRef.current = false;\n    }\n  }\n'''
          p.write_text(s[:start]+new+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name "El pueblo Duerme"
          git config user.email "zalenatarot@gmail.com"
          git add components/game/play/GamePlay.tsx
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove client day authority"
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/refactor-day-client.yml
          git add .github/workflows/refactor-day-client.yml
          git commit -m "chore: remove temporary refactor workflow"
          git push
