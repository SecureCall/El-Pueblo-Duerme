name: tmp-migrate-gameplay-day
on:
  push:
    branches: [audit/role-swap-authority]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/role-swap-authority
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('components/game/play/GamePlay.tsx')
          s = p.read_text(encoding='utf-8')
          original = s
          old_import = "import { BOT_VOTE_CONFIG, pickBotVoteTarget, type BotType, FALLBACK_BOT_MESSAGES, BOT_NARRATOR_SPOTLIGHTS } from '@/lib/bots/botSystem';"
          assert s.count(old_import) == 1
          s = s.replace(old_import, "import { type BotType, FALLBACK_BOT_MESSAGES, BOT_NARRATOR_SPOTLIGHTS } from '@/lib/bots/botSystem';", 1)
          s = s.replace("import { requestResolveNight } from '@/lib/game/resolveNight';", "import { requestResolveNight } from '@/lib/game/resolveNight';\nimport { requestResolveDay } from '@/lib/game/resolveDay';", 1)
          for line in ['  const aiDayVotedRound = useRef<number>(-1);\\n','  const processingDayRef = useRef(false);\\n','  const dayResolutionLeaseRef = useRef<string | null>(null);\\n']:
              assert s.count(line) == 1, line
              s = s.replace(line, '', 1)
          s, n = re.subn(r"\\n  async function processDayVotes\\(dayVotes: Record<string, string>\\) \\{.*?\\n  \\}\\n\\n  // Cazador fires last shot", "\\n  // Cazador fires last shot", s, count=1, flags=re.S)
          assert n == 1, 'processDayVotes'
          s, n = re.subn(r"\\n  // Host processes day votes when all eligible alive players have voted\\n  useEffect\\(\\(\\) => \\{.*?\\n  \\}, \\[votesFromSub, game\\?\\.phase\\]\\);\\n", "\\n", s, count=1, flags=re.S)
          assert n == 1, 'host effect'
          s, n = re.subn(r"\\n  // ── Anti-softlock: force processDayVotes when day timer expires ───────────\\n  useEffect\\(\\(\\) => \\{.*?\\n  \\}, \\[game\\?\\.phase, game\\?\\.roundNumber, game\\?\\.dayStartedAt, game\\?\\.phaseEndsAt\\]\\);\\n", "\\n", s, count=1, flags=re.S)
          assert n == 1, 'deadline effect'
          s, n = re.subn(r"\\n  // Host auto-votes for AI players during day — personality-based timing\\n  useEffect\\(\\(\\) => \\{.*?\\n  \\}, \\[game\\?\\.phase, game\\?\\.roundNumber, game\\?\\.dayStartedAt\\]\\);\\n", "\\n", s, count=1, flags=re.S)
          assert n == 1, 'browser ai'
          old = """          onTimerEnd={() => {\n            if (game.hostUid === user.uid) {\n              processDayVotes(votesFromSub);\n            }\n          }}"""
          assert s.count(old) == 1
          s = s.replace(old, '          onTimerEnd={() => {}}', 1)
          marker = "  // ── Host absence detection: check /presence every 30s, auto-claim after 5min ─"
          assert s.count(marker) == 1
          effect = '''  // ── Server-authoritative day resolver trigger ───────────────────────────\n  // Any alive player may ask the server to resolve. The server decides whether\n  // votes, AI timing, or the authoritative deadline are sufficient.\n  const dayResolveInFlightRef = useRef(false);\n  useEffect(() => {\n    if (!game || !user || game.phase !== 'day') return;\n    const me = (game.players ?? []).find(p => p.uid === user.uid);\n    if (!me?.isAlive) return;\n    const attempt = async () => {\n      if (dayResolveInFlightRef.current) return;\n      dayResolveInFlightRef.current = true;\n      try {\n        await requestResolveDay(gameId);\n      } catch (error) {\n        const message = error instanceof Error ? error.message : String(error);\n        if (message !== 'INCOMPLETE_DAY') console.warn('[DayResolution] server trigger did not commit:', message);\n      } finally {\n        dayResolveInFlightRef.current = false;\n      }\n    };\n    void attempt();\n    const timer = setInterval(() => { void attempt(); }, 2000);\n    return () => clearInterval(timer);\n  }, [game?.phase, game?.roundNumber, game?.phaseEndsAt, game?.players, user?.uid, gameId]);\n\n'''
          s = s.replace(marker, effect + marker, 1)
          forbidden = ['async function processDayVotes','Host processes day votes when all eligible alive players have voted','Host auto-votes for AI players during day','BOT_VOTE_CONFIG','pickBotVoteTarget','processDayVotes(','dayResolutionLeaseRef','processingDayRef','aiDayVotedRound']
          for token in forbidden: assert token not in s, token
          assert s != original
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          ! grep -nE 'processDayVotes|Host processes day votes|Host auto-votes for AI players|BOT_VOTE_CONFIG|pickBotVoteTarget|dayResolutionLeaseRef|processingDayRef|aiDayVotedRound' components/game/play/GamePlay.tsx
          grep -n 'requestResolveDay' components/game/play/GamePlay.tsx
          git diff --check
      - name: Commit
        run: |
          git config user.name 'El pueblo Duerme'
          git config user.email 'zalenatarot@gmail.com'
          git add components/game/play/GamePlay.tsx
          git commit -m 'refactor: make GamePlay day resolution host-independent'
          git push origin HEAD:audit/role-swap-authority
