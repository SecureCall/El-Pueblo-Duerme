name: tmp-migrate-gameplay-day

on:
  push:
    branches:
      - audit/role-swap-authority

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/role-swap-authority
          fetch-depth: 0

      - name: Apply safe GamePlay migration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/game/play/GamePlay.tsx')
          s = path.read_text(encoding='utf-8')
          original = s

          old_import = "import { BOT_VOTE_CONFIG, pickBotVoteTarget, type BotType, FALLBACK_BOT_MESSAGES, BOT_NARRATOR_SPOTLIGHTS } from '@/lib/bots/botSystem';"
          new_import = "import { type BotType, FALLBACK_BOT_MESSAGES, BOT_NARRATOR_SPOTLIGHTS } from '@/lib/bots/botSystem';"
          assert s.count(old_import) == 1, 'Unexpected bot import count'
          s = s.replace(old_import, new_import)

          for line in [
              '  const aiDayVotedRound = useRef<number>(-1);\n',
              '  const processingDayRef = useRef(false);\n',
              '  const dayResolutionLeaseRef = useRef<string | null>(null);\n',
          ]:
              assert s.count(line) == 1, f'Missing/duplicate ref: {line.strip()}'
              s = s.replace(line, '')

          s = s.replace(
              "import { requestResolveNight } from '@/lib/game/resolveNight';",
              "import { requestResolveNight } from '@/lib/game/resolveNight';\nimport { requestResolveDay } from '@/lib/game/resolveDay';",
              1,
          )

          pattern = r"\n  async function processDayVotes\(dayVotes: Record<string, string>\) \{.*?\n  \}\n\n  // Cazador fires last shot"
          s, n = re.subn(pattern, "\n  // Cazador fires last shot", s, count=1, flags=re.S)
          assert n == 1, 'Legacy processDayVotes block not found exactly once'

          pattern = r"\n  // Host processes day votes when all eligible alive players have voted\n  useEffect\(\(\) => \{.*?\n  \}, \[votesFromSub, game\?\.phase\]\);\n"
          s, n = re.subn(pattern, "\n", s, count=1, flags=re.S)
          assert n == 1, 'Host day-resolution effect not found exactly once'

          pattern = r"\n  // ── Anti-softlock: force processDayVotes when day timer expires ───────────\n  useEffect\(\(\) => \{.*?\n  \}, \[game\?\.phase, game\?\.roundNumber, game\?\.dayStartedAt, game\?\.phaseEndsAt\]\);\n"
          s, n = re.subn(pattern, "\n", s, count=1, flags=re.S)
          assert n == 1, 'Legacy client deadline resolver not found exactly once'

          pattern = r"\n  // Host auto-votes for AI players during day — personality-based timing\n  useEffect\(\(\) => \{.*?\n  \}, \[game\?\.phase, game\?\.roundNumber, game\?\.dayStartedAt\]\);\n"
          s, n = re.subn(pattern, "\n", s, count=1, flags=re.S)
          assert n == 1, 'Browser AI day voter not found exactly once'

          old_timer = """          onTimerEnd={() => {\n            if (game.hostUid === user.uid) {\n              processDayVotes(votesFromSub);\n            }\n          }}"""
          assert s.count(old_timer) == 1, 'DayPhase legacy onTimerEnd callback not found exactly once'
          s = s.replace(old_timer, "          onTimerEnd={() => {}}", 1)

          marker = "  // ── Host absence detection: check /presence every 30s, auto-claim after 5min ─\n"
          assert s.count(marker) == 1, 'Insertion marker not found exactly once'
          effect = r'''  // ── Server-authoritative day resolver trigger ───────────────────────────
  // Any alive player may ask the server to resolve. The server decides whether
  // votes/AI timing/deadline are sufficient; this client never computes state.
  const dayResolveInFlightRef = useRef(false);
  useEffect(() => {
    if (!game || !user || game.phase !== 'day') return;
    const me = (game.players ?? []).find(p => p.uid === user.uid);
    if (!me?.isAlive) return;

    const attempt = async () => {
      if (dayResolveInFlightRef.current) return;
      dayResolveInFlightRef.current = true;
      try {
        await requestResolveDay(gameId);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        if (message !== 'INCOMPLETE_DAY') {
          console.warn('[DayResolution] server trigger did not commit:', message);
        }
      } finally {
        dayResolveInFlightRef.current = false;
      }
    };

    void attempt();
    const timer = setInterval(() => { void attempt(); }, 2000);
    return () => clearInterval(timer);
  }, [game?.phase, game?.roundNumber, game?.phaseEndsAt, game?.players, user?.uid, gameId]);

'''
          s = s.replace(marker, effect + marker, 1)

          forbidden = [
              'async function processDayVotes',
              'Host processes day votes when all eligible alive players have voted',
              'Host auto-votes for AI players during day',
              'BOT_VOTE_CONFIG',
              'pickBotVoteTarget',
              'processDayVotes(',
              'dayResolutionLeaseRef',
              'processingDayRef',
              'aiDayVotedRound',
          ]
          for token in forbidden:
              assert token not in s, f'Forbidden legacy token remains: {token}'

          assert s != original, 'Migration made no changes'
          path.write_text(s, encoding='utf-8')

      - name: Verify authority guards
        run: |
          test -f components/game/play/GamePlay.tsx
          ! grep -nE 'processDayVotes|Host processes day votes|Host auto-votes for AI players|BOT_VOTE_CONFIG|pickBotVoteTarget|dayResolutionLeaseRef|processingDayRef|aiDayVotedRound' components/game/play/GamePlay.tsx
          grep -n "requestResolveDay" components/game/play/GamePlay.tsx

      - name: Commit migration
        run: |
          git config user.name "El pueblo Duerme"
          git config user.email "zalenatarot@gmail.com"
          git add components/game/play/GamePlay.tsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: make GamePlay day resolution host-independent"
          git push origin HEAD:audit/role-swap-authority
