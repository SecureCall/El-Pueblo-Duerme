name: One-shot day vote migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Replace direct vote writes
        env:
          GAME_FILE: components/game/play/GamePlay.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/game/play/GamePlay.tsx')
          text = path.read_text(encoding='utf-8')

          old_human = '''    let actualTarget = targetUid;\n    if (game.sirenaLinked === user.uid && game.sirenaUid) {\n      actualTarget = votesFromSub[game.sirenaUid] ?? targetUid;\n    }\n    try {\n      await setDoc(doc(db, 'games', gameId, 'votes', user.uid), {\n        target: actualTarget,\n        round: game.roundNumber ?? 1,\n        submittedAt: Date.now(),\n      });'''
          new_human = '''    const round = game.roundNumber ?? 1;\n    try {\n      const idToken = await user.getIdToken();\n      const response = await fetch('/api/day-vote', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` },\n        body: JSON.stringify({ gameId, uid: user.uid, target: targetUid, round }),\n      });\n      if (!response.ok) {\n        const data = await response.json().catch(() => ({}));\n        throw new Error(data.error ?? `day-vote ${response.status}`);\n      }'''
          if old_human not in text:
              raise SystemExit('human vote block not found')
          text = text.replace(old_human, new_human, 1)

          old_ai = '''          await setDoc(doc(db, 'games', gameId, 'votes', capturedUid), {\n            target: targetUid,\n            round,\n            submittedAt: Date.now(),\n          });'''
          new_ai = '''          const idToken = await user.getIdToken();\n          const voteResponse = await fetch('/api/day-vote', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` },\n            body: JSON.stringify({ gameId, uid: capturedUid, target: targetUid, round }),\n          });\n          if (!voteResponse.ok) return;'''
          if old_ai not in text:
              raise SystemExit('AI vote block not found')
          text = text.replace(old_ai, new_ai, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-day-votes-server-authoritative.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx .github/workflows/patch-day-votes-server-authoritative.yml
          git diff --cached --check
          git commit -m "security: route all online day votes through server"
          git push
