name: Wire day resolution lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch GamePlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/game/play/GamePlay.tsx')
          s = p.read_text(encoding='utf-8')
          old = "  const processingDayRef = useRef(false);\n"
          new = old + "  const dayResolutionLeaseRef = useRef<string | null>(null);\n"
          if new not in s:
              if old not in s: raise SystemExit('processingDayRef anchor not found')
              s = s.replace(old, new, 1)

          old_start = """  async function processDayVotes(dayVotes: Record<string, string>) {
    if (!game) return;
    if (game.phase !== 'day' && game.phase !== 'voting') { return; }
    if (processingDayRef.current) return;
    processingDayRef.current = true;
    const roles = game.roles ?? {};
"""
          new_start = """  async function processDayVotes(dayVotes: Record<string, string>) {
    if (!game) return;
    if (game.phase !== 'day' && game.phase !== 'voting') { return; }
    if (processingDayRef.current) return;
    processingDayRef.current = true;

    // El resultado del día necesita un único propietario server-side. El host
    // reclama un lease transaccional y recibe además los votos validados por
    // ronda/vida directamente desde Firestore; nunca usamos dayVotes del game doc
    // como fuente de verdad.
    let dayLeaseId: string | null = null;
    try {
      if (!user) throw new Error('AUTH_REQUIRED');
      const idToken = await user.getIdToken();
      const lockResponse = await fetch('/api/day-resolve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` },
        body: JSON.stringify({ gameId, action: 'claim' }),
      });
      const lockData = await lockResponse.json().catch(() => ({}));
      if (!lockResponse.ok || !lockData.ok || !lockData.leaseId) {
        if (lockResponse.status === 409) console.info('[DayResolution] another resolver owns the lease');
        processingDayRef.current = false;
        return;
      }
      dayLeaseId = lockData.leaseId;
      dayResolutionLeaseRef.current = dayLeaseId;
      if (Number(lockData.round) !== (game.roundNumber ?? 1)) {
        processingDayRef.current = false;
        return;
      }
      dayVotes = lockData.votes ?? {};
    } catch (e) {
      console.error('[DayResolution] lease claim failed:', e);
      processingDayRef.current = false;
      return;
    }

    const roles = game.roles ?? {};
"""
          if old_start not in s: raise SystemExit('processDayVotes start not found')
          s = s.replace(old_start, new_start, 1)

          old_finally = """    } catch (e) {
      console.error('processDayVotes updateDoc error:', e);
    } finally {
      processingDayRef.current = false;
    }
  }
"""
          new_finally = """    } catch (e) {
      console.error('processDayVotes updateDoc error:', e);
    } finally {
      if (dayLeaseId) {
        try {
          const idToken = await user?.getIdToken();
          if (idToken) {
            await fetch('/api/day-resolve', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${idToken}` },
              body: JSON.stringify({ gameId, action: 'release', leaseId: dayLeaseId }),
            });
          }
        } catch (e) {
          console.warn('[DayResolution] lease release failed; it will expire automatically:', e);
        }
        if (dayResolutionLeaseRef.current === dayLeaseId) dayResolutionLeaseRef.current = null;
      }
      processingDayRef.current = false;
    }
  }
"""
          if old_finally not in s: raise SystemExit('processDayVotes final block not found')
          s = s.replace(old_finally, new_finally, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          rm .github/workflows/patch-day-resolution-client.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx .github/workflows/patch-day-resolution-client.yml
          git commit -m "security: make day resolution single-owner and vote-authoritative"
          git push
