name: Migrate NightPhase Private Role

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: "!contains(github.event.head_commit.message, 'fix: remove public role lookups from NightPhase')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite public role filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/game/play/NightPhase.tsx')
          s=p.read_text(encoding='utf-8')
          old=""".filter(p => game.roles?.[p.uid] !== 'Lobo' && game.roles?.[p.uid] !== 'Lobo Blanco' && game.roles?.[p.uid] !== 'Cría de Lobo')"""
          new=""".filter(p => !wolfRoster.some(w => w.uid === p.uid))"""
          if old not in s: raise SystemExit('wolf exclusion lookup not found')
          s=s.replace(old,new)
          old2=""".filter(p => p.uid !== userId && (game.roles?.[p.uid] === 'Lobo' || game.roles?.[p.uid] === 'Lobo Blanco' || game.roles?.[p.uid] === 'Cría de Lobo'))"""
          new2=""".filter(p => p.uid !== userId && wolfRoster.some(w => w.uid === p.uid))"""
          if old2 not in s: raise SystemExit('wolf roster lookup not found')
          s=s.replace(old2,new2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add regression guard
        run: |
          cat > tests/nightPhasePrivateRoleGuard.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const source=readFileSync(resolve(process.cwd(),'components/game/play/NightPhase.tsx'),'utf8');
          describe('NightPhase private role guard',()=>{
            it('does not inspect the public role map',()=>expect(source).not.toMatch(/game\.roles\?\./));
            it('uses the authorized wolf roster',()=>expect(source).toContain('wolfRoster.some'));
            it('loads private state from the server',()=>expect(source).toContain('getPrivateGameState'));
          });
          EOF
      - name: Validate
        run: |
          git diff --check
          npm ci
          npx vitest run tests/nightPhasePrivateRoleGuard.test.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/NightPhase.tsx tests/nightPhasePrivateRoleGuard.test.ts .github/workflows/migrate-nightphase-private-role.yml
          git diff --cached --check
          git commit -m 'fix: remove public role lookups from NightPhase'
          git push origin main
