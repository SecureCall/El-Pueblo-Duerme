name: Repair GamePlay Authority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Migrate critical GamePlay writes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/game/play/GamePlay.tsx')
          text = path.read_text(encoding='utf-8')

          if "from '@/lib/game/nightActions'" not in text:
              anchor = "import { playNightAmbience, playDayAmbience, stopAllAmbience, playDeathSting, playVoteAlarm, playGameStart, playVictory, playDefeat } from '@/lib/gameAudio';\n"
              replacement = anchor + "import { requestNightAction } from '@/lib/game/nightActions';\nimport { requestStartNight } from '@/lib/game/startNight';\n"
              if anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(anchor, replacement, 1)

          old_advance = """    try {\n      const now = Date.now();\n      await updateDoc(doc(db, 'games', gameId), { phase: 'night', nightActions: {}, nightSubmissions: {}, nightStartedAt: now, phaseEndsAt: now + 60000 });\n    } catch (e) { console.error('advanceFromRoleReveal error:', e); }"""
          new_advance = """    try {\n      await requestStartNight(gameId);\n    } catch (e) { console.error('advanceFromRoleReveal error:', e); }"""
          if old_advance in text:
              text = text.replace(old_advance, new_advance, 1)
          elif "await requestStartNight(gameId);" not in text:
              raise SystemExit('roleReveal→night write not found')

          pattern = re.compile(r"  const submitNightAction = useCallback\(async \(action: Record<string, unknown>\) => \{.*?\n  \}, \[game, user, gameId\]\);", re.S)
          replacement = """  const submitNightAction = useCallback(async (action: Record<string, unknown>) => {\n    if (!game || !user) return;\n    if (game.phase !== 'night') { console.warn('[FSM] submitNightAction rejected — not night phase'); return; }\n    const me = game.players?.find(p => p.uid === user.uid);\n    if (!me?.isAlive) { console.warn('[FSM] submitNightAction rejected — player not alive'); return; }\n\n    try {\n      await requestNightAction(gameId, action);\n    } catch (e) { console.error('submitNightAction error:', e); }\n  }, [game, user, gameId]);"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('submitNightAction block not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: route GamePlay night transitions and actions through server'
          git push origin main

      - name: Remove one-time repair workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-gameplay-authority.yml
          git commit -m 'chore: remove one-time GamePlay authority repair'
          git push origin main
