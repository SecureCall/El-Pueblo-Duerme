name: Migrate EndGame private reveal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore known-good EndGame and patch private reveal
        shell: bash
        run: |
          set -euo pipefail
          git show 526aa7ade421bdae1711fdea6141d4433e82f998 > components/game/play/EndGame.tsx
          python3 - <<'PY'
          from pathlib import Path

          ep = Path('components/game/play/EndGame.tsx')
          s = ep.read_text()
          original = s

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'EndGame: missing anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              "import { recordGameResult } from '@/lib/bots/playerStats';",
              "import { recordGameResult } from '@/lib/bots/playerStats';\nimport { getPrivateGameState } from '@/lib/game/privateStateClient';",
              'private-state import',
          )
          replace_once(
              "  onPlayAgainSameRoom?: () => void;\n}",
              "  onPlayAgainSameRoom?: () => void;\n  gameId: string;\n}",
              'gameId prop',
          )
          replace_once(
              "export function EndGame({ game, myRole, myUid, isHost, hostInGame = true, winners, winMessage, onPlayAgain, onPlayAgainSameRoom }: Props) {",
              "export function EndGame({ game, gameId, myRole, myUid, isHost, hostInGame = true, winners, winMessage, onPlayAgain, onPlayAgainSameRoom }: Props) {",
              'gameId destructuring',
          )
          replace_once(
              "  const shareCardRef = useRef<HTMLDivElement>(null);",
              "  const shareCardRef = useRef<HTMLDivElement>(null);\n  const [revealedRoles, setRevealedRoles] = useState<Record<string, string>>({});\n  const [revealedWolfTeam, setRevealedWolfTeam] = useState<Record<string, boolean>>({});\n\n  useEffect(() => {\n    if (game.phase !== 'ended' && game.status !== 'ended') return;\n    let cancelled = false;\n    getPrivateGameState(gameId).then((state) => {\n      if (cancelled || state.phase !== 'ended') return;\n      setRevealedRoles(state.roles ?? {});\n      setRevealedWolfTeam(state.wolfTeam ?? {});\n    }).catch((err) => console.error('[EndGame] private reveal error:', err));\n    return () => { cancelled = true; };\n  }, [game.phase, game.status, gameId]);",
              'private reveal effect',
          )
          replace_once(
              "  const dramaMsg = buildDramaMessage(myUid, myRole, winners, game, iWon);",
              "  const revealedGame = { ...game, roles: revealedRoles, wolfTeam: revealedWolfTeam };\n  const dramaMsg = buildDramaMessage(myUid, myRole, winners, revealedGame, iWon);",
              'drama revealed game',
          )
          replace_once(
              "  const wolfTeamUids = new Set(Object.keys(game.wolfTeam ?? {}));\n  const rounds = game.roundNumber ?? eliminated.length;",
              "  const wolfTeamUids = new Set(Object.keys(revealedWolfTeam));\n  const rounds = game.roundNumber ?? eliminated.length;",
              'wolf team state',
          )
          replace_once(
              "const text = buildShareText(game, winners, winMessage, myUid, myRole, iWon);",
              "const text = buildShareText(revealedGame, winners, winMessage, myUid, myRole, iWon);",
              'share text',
          )
          replace_once("const role = game.roles?.[p.uid] ?? 'Lobo';", "const role = revealedRoles[p.uid] ?? 'Lobo';", 'wolf role summary')
          replace_once("const role = game.roles?.[p.uid] ?? 'Aldeano';", "const role = revealedRoles[p.uid] ?? 'Aldeano';", 'survivor role summary')
          replace_once("const role = game.roles?.[p.uid] ?? 'Aldeano';", "const role = revealedRoles[p.uid] ?? 'Aldeano';", 'roles tab role')
          replace_once("`${p.name} (${game.roles?.[p.uid] ?? 'Lobo'})`", "`${p.name} (${revealedRoles[p.uid] ?? 'Lobo'})`", 'share card role')
          if s == original:
              raise SystemExit('EndGame: no changes applied')
          ep.write_text(s)

          gp = Path('components/game/play/GamePlay.tsx')
          g = gp.read_text()
          if 'gameId={gameId}' not in g:
              marker = "        game={game}\n        myRole={myRole}"
              if marker not in g:
                  raise SystemExit('GamePlay: EndGame invocation anchor missing')
              g = g.replace(marker, "        game={game}\n        gameId={gameId}\n        myRole={myRole}", 1)
              gp.write_text(g)

          # Strong postconditions: this migration must never leave the old public role consumers in EndGame.
          if 'game.roles' in s or 'game.wolfTeam' in s:
              raise SystemExit('EndGame: public secret consumer remains')
          if 'getPrivateGameState(gameId)' not in s:
              raise SystemExit('EndGame: private reveal call missing')
          if 'gameId={gameId}' not in g:
              raise SystemExit('GamePlay: EndGame gameId prop missing')
          PY
          git diff --check
          grep -n "getPrivateGameState\|revealedRoles\|revealedWolfTeam\|gameId={gameId}\|game.roles\|game.wolfTeam" components/game/play/EndGame.tsx components/game/play/GamePlay.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game/play/EndGame.tsx components/game/play/GamePlay.tsx
          git commit -m "fix: migrate EndGame to private role reveal"
          git push origin HEAD:main
