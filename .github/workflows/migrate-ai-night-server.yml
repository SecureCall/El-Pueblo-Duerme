name: migrate-ai-night-server
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace client AI night authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('components/game/play/GamePlay.tsx')
          text = path.read_text()
          start = "  // Host auto-submits AI players' night actions"
          end = "  // Host listens to wolf chat"
          pattern = re.escape(start) + r'.*?(?=\\n' + re.escape(end) + r')'
          replacement = '''  // AI night actions are generated and persisted by the authenticated server.\n  // The client only requests the server-side planner; it never writes nightActions/nightSubmissions.\n  useEffect(() => {\n    if (!game || !user || game.phase !== 'night' || game.hostUid !== user.uid) return;\n\n    const round = game.roundNumber ?? 1;\n    const MIN_NIGHT_DELAY = 10000;\n    const elapsed = Date.now() - nightStartedAtRef.current;\n    const waitMs = Math.max(500, MIN_NIGHT_DELAY - elapsed);\n\n    const timer = setTimeout(async () => {\n      try {\n        const idToken = await user.getIdToken();\n        const response = await fetch('/api/ai-night', {\n          method: 'POST',\n          headers: {\n            'Content-Type': 'application/json',\n            Authorization: `Bearer ${idToken}`,\n          },\n          body: JSON.stringify({ gameId }),\n        });\n        const result = await response.json().catch(() => ({}));\n        if (!response.ok) {\n          console.warn('[AI night] server rejected request:', result?.error ?? response.status);\n          return;\n        }\n        console.info('[AI night] server submissions accepted', {\n          roundNumber: result?.roundNumber ?? round,\n          accepted: result?.accepted?.length ?? 0,\n          rejected: result?.rejected?.length ?? 0,\n        });\n      } catch (error) {\n        console.error('[AI night] server request failed:', error);\n      }\n    }, waitMs);\n\n    return () => clearTimeout(timer);\n  }, [game?.phase, game?.roundNumber, game?.hostUid, user?.uid, gameId]);\n'''
          if start not in text or end not in text:
              raise SystemExit('AI migration markers not found')
          new_text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one replacement, got {count}')
          path.write_text(new_text)
          PY
          git diff --check
          git diff -- components/game/play/GamePlay.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game/play/GamePlay.tsx
          git commit -m "feat: route AI night actions through server"
          git push
      - name: Remove migration workflow
        shell: bash
        run: |
          git rm .github/workflows/migrate-ai-night-server.yml
          git commit -m "chore: remove one-shot AI night migration workflow"
          git push
