name: Repair GamePlay integrity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore only if GamePlay is the collapsed migration artifact
        shell: bash
        run: |
          set -euo pipefail
          lines=$(wc -l < components/game/play/GamePlay.tsx)
          if [ "$lines" -gt 500 ]; then
            echo "GamePlay looks intact ($lines lines); nothing to repair."
            exit 0
          fi
          echo "GamePlay is unexpectedly short ($lines lines); restoring known-good parent."
          git checkout afb229f713df1b47f903bf32738b41953b09b371 -- components/game/play/GamePlay.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/game/play/GamePlay.tsx
          git commit -m "fix: restore intact GamePlay after migration guard"
          git push origin HEAD:main
