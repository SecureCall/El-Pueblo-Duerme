name: Generate Native Projects

on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - capacitor.config.ts
      - .github/workflows/generate-native-projects.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/fix-release
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate iOS project
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        run: npx cap sync

      - name: Commit generated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios capacitor.config.ts package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No native project changes to commit."
            exit 0
          fi
          git commit -m "build: generate Android and iOS projects"
          git push origin HEAD:audit/fix-release
