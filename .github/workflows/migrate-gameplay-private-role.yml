name: Migrate GamePlay Private Role

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: migrate GamePlay private role authority') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite private role consumers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/game/play/GamePlay.tsx')
          s = p.read_text(encoding='utf-8')
          marker = "import { requestHostTakeover } from '@/lib/game/hostTakeover';"
          addition = "\nimport { getPrivateGameState } from '@/lib/game/privateStateClient';"
          if 'privateStateClient' not in s:
              if marker not in s: raise SystemExit('import marker not found')
              s = s.replace(marker, marker + addition, 1)
          state_marker = "  const [game, setGame] = useState<GameState | null>(null);"
          state_add = "\n  const [privateMyRole, setPrivateMyRole] = useState<string | null>(null);\n  const [privateWolfRoster, setPrivateWolfRoster] = useState<Array<{ uid: string; name: string }>>([]);"
          if 'privateMyRole' not in s:
              if state_marker not in s: raise SystemExit('state marker not found')
              s = s.replace(state_marker, state_marker + state_add, 1)
          effect_marker = "  useEffect(() => {\n    const unsub = onSnapshot("
          effect_add = """  useEffect(() => {
    if (!user || !gameId) return;
    let cancelled = false;
    getPrivateGameState(gameId).then(state => {
      if (cancelled) return;
      setPrivateMyRole(state.myRole);
      setPrivateWolfRoster(state.wolfRoster ?? []);
    }).catch(() => {});
    return () => { cancelled = true; };
  }, [user, gameId, game?.phase, game?.roundNumber]);

"""
          if 'getPrivateGameState(gameId)' not in s:
              if effect_marker not in s: raise SystemExit('snapshot marker not found')
              s = s.replace(effect_marker, effect_add + effect_marker, 1)
          old = "      const myRole = game.roles?.[myUid ?? ''];\n      const wolfTeamUids = new Set(Object.keys(game.wolfTeam ?? {}));\n      const isWolfSide = myUid ? wolfTeamUids.has(myUid) : false;"
          new = "      const myRole = privateMyRole ?? null;\n      const wolfTeamUids = new Set(privateWolfRoster.map(w => w.uid));\n      const isWolfSide = myUid ? wolfTeamUids.has(myUid) : false;"
          if old not in s: raise SystemExit('role consumer not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Regression guard
        run: |
          cat > tests/gamePlayPrivateRoleGuard.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const source = readFileSync(resolve(process.cwd(), 'components/game/play/GamePlay.tsx'), 'utf8');
          describe('GamePlay private role guard', () => {
            it('uses authenticated private state for own role', () => {
              expect(source).toContain('getPrivateGameState');
              expect(source).toContain('privateMyRole');
              expect(source).not.toMatch(/const myRole = game\.roles\?\./);
            });
            it('does not derive own wolf membership from public wolfTeam', () => {
              expect(source).not.toMatch(/const wolfTeamUids = new Set\(Object\.keys\(game\.wolfTeam/);
            });
          });
          EOF
          git diff --check
          npm ci
          npx vitest run tests/gamePlayPrivateRoleGuard.test.ts
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/game/play/GamePlay.tsx tests/gamePlayPrivateRoleGuard.test.ts .github/workflows/migrate-gameplay-private-role.yml
          git diff --cached --check
          git commit -m 'fix: migrate GamePlay private role authority'
          git push origin main