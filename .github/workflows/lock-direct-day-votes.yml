name: Lock direct day vote writes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Lock vote writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('firestore.rules')
          text = path.read_text(encoding='utf-8')
          start = text.find("    match /games/{gameId}/votes/{voterUid} {")
          if start < 0:
              raise SystemExit('votes rule not found')
          end = text.find("    match /games/{gameId}/lobbyChat/{messageId} {", start)
          if end < 0:
              raise SystemExit('votes rule end not found')
          replacement = '''    // ── Votos de día — sólo el servidor puede escribirlos ────────────────
    // El cliente usa /api/day-vote y el Service Worker usa /api/sync-vote.
    // Ambos endpoints validan identidad, ronda, fase, vida del votante,
    // objetivo y bans antes de escribir con Admin SDK.
    match /games/{gameId}/votes/{voterUid} {
      allow read: if isAuth();
      allow create, update, delete: if false;
    }

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          rm .github/workflows/lock-direct-day-votes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules .github/workflows/lock-direct-day-votes.yml
          git commit -m "security: close direct Firestore day vote writes"
          git push
